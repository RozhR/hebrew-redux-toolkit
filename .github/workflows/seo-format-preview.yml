name: SEO format preview
on:
    push:
        branches:
            - seo-foundation-2026-10
permissions:
    contents: read
jobs:
    preview:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - run: npx prettier src/components/Home.tsx src/components/SeoMeta.tsx --write
            - run: git diff -- src/components/Home.tsx src/components/SeoMeta.tsx
